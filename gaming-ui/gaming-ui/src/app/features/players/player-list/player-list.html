<!-- player-list.html -->

<div class="container mt-4">
  <h2>Players</h2>

  <div *ngIf="loading">
    Loading players...
  </div>

  <table
    class="table table-bordered table-striped"
    *ngIf="!loading && players.length > 0"
  >
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Email</th>
        <th>Created At</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let player of players">
        <td>{{ player.id }}</td>
        <td>{{ player.name }}</td>
        <td>{{ player.email }}</td>
        <td>{{ player.createdAt | date:'medium' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && players.length === 0">
    No players found.
  </div>
</div>
